<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <title>
    Thời khóa biểu - Cao đẳng Điện tử Điện lạnh Hà Nội
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="topbar">

  <div class="brand">

    <div class="brand-icon">
      TKB
    </div>

    <div>

      <h1>
        Thời khóa biểu
      </h1>

      <p>
        Cao đẳng Điện tử - Điện lạnh Hà Nội
      </p>

    </div>

  </div>


  <div class="top-actions">

    <button
      id="syncBtn"
      class="btn primary"
      type="button"
    >
      ↻ Đồng bộ dữ liệu
    </button>


    <button
      id="clearBtn"
      class="btn danger ghost"
      type="button"
    >
      Xóa dữ liệu máy
    </button>

  </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


  <!-- ===================================================
       TRẠNG THÁI
  ==================================================== -->

  <section class="status-card">

    <div class="status-left">

      <div>

        <span
          id="statusDot"
          class="status-dot"
        ></span>

        <strong id="storageStatus">
          Đang dùng dữ liệu mặc định
        </strong>

      </div>


      <small id="syncStatus">
        Chưa có dữ liệu đồng bộ từ API
      </small>

    </div>

  </section>


  <!-- ===================================================
       TAB LỚP
  ==================================================== -->

  <nav class="tabs">

    <button
      class="tab active"
      data-view="all"
      type="button"
    >
      Tổng hợp
    </button>


    <button
      class="tab"
      data-view="11e3"
      type="button"
    >
      Lớp 11E3
    </button>


    <button
      class="tab"
      data-view="52dt"
      type="button"
    >
      Lớp 52ĐT
    </button>

  </nav>


  <!-- ===================================================
       BỘ LỌC TUẦN / CA
  ==================================================== -->

  <section class="schedule-filter">


    <!-- =================================================
         TUẦN HỌC
    ================================================== -->

    <div class="filter-group">

      <label>
        Tuần học
      </label>


      <div class="week-dropdown">


        <!-- NÚT CHỌN TUẦN -->

        <button
          type="button"
          id="weekDropdownBtn"
          class="week-dropdown-btn"
        >

          <span id="selectedWeekText">
            Chưa có dữ liệu tuần
          </span>

          <span class="week-arrow">
            ▾
          </span>

        </button>


        <!-- =================================================
             DANH SÁCH TUẦN

             JS sẽ tự tạo từ dữ liệu API.
        ================================================== -->

        <div
          id="weekDropdownList"
          class="week-dropdown-list"
        >

          <div class="week-empty">
            Chưa có dữ liệu tuần
          </div>

        </div>

      </div>

    </div>


    <!-- =================================================
         CA HỌC
    ================================================== -->

    <div class="filter-group">

      <label>
        Ca học
      </label>


      <!--
        QUAN TRỌNG:

        app.js tìm .shift-options

        Không cố định Ca 1 / Ca 2 ở HTML.
        JS sẽ lấy đúng ca đang có trong API.
      -->

      <div class="shift-options">

        <div class="shift-empty">
          Chưa có dữ liệu ca
        </div>

      </div>

    </div>


  </section>


  <!-- ===================================================
       APP
  ==================================================== -->

  <section id="app"></section>


</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

  <span>
    HỌC CHO CHÍNH MÌNH
  </span>

  <span id="updatedText">
    Chưa đồng bộ
  </span>

</footer>


<!-- =====================================================
     TOAST
===================================================== -->

<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite"
></div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="app.js"></script>

</body>
</html>
